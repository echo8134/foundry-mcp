name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pull-requests: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Refuse a tag that is not the module's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./module/module.json").version')"
          test "$TAG" = "v$version" || { echo "Tag $TAG does not match module.json version $version."; exit 1; }
      - name: Collect release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Pack the module with module.json at the root of the zip
        run: cd module && zip -r -X ../module.zip . && cp module.json ../module.json
      - name: Attest where the release files were built
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            module.zip
            module.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" module.json module.zip --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
