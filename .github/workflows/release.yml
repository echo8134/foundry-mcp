name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Refuse a tag that is not the module's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./module/module.json").version')"
          test "$TAG" = "v$version" || { echo "Tag $TAG does not match module.json version $version."; exit 1; }
      - name: Pack the module with module.json at the root of the zip
        run: cd module && zip -r -X ../module.zip . && cp module.json ../module.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" module.json module.zip --title "$TAG" --generate-notes --verify-tag
